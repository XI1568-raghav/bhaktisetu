# Render Blueprint v1 — API web service only.
# Path-filtered so only API-relevant changes trigger a rebuild (free-tier quota
# protection). Docs-only / web-only / admin-only / agent-report pushes are
# skipped by Render's renderBuildFilter. Verified 2026-07-07.
#
# Build/start commands are the EXACT scripts from apps/api/package.json:
#   "build": "tsc"
#   "start": "prisma migrate deploy && node dist/server.js"
# scoped to the @poojly/api workspace package via pnpm --filter.
services:
  - type: web
    name: bhaktisetu
    env: node
    plan: free
    region: oregon
    # apps/api/package.json: "build": "tsc"  (run inside the @poojly/api pkg)
    buildCommand: pnpm --filter @poojly/api build
    # apps/api/package.json: "start": "prisma migrate deploy && node dist/server.js"
    # pnpm --filter ... start runs the script in the package dir, so dist/ and
    # the local prisma binary resolve correctly.
    startCommand: pnpm --filter @poojly/api start
    healthCheckPath: /health
    # autoDeploy:false mirrors the web docker service below. On the free tier
    # a new push to main cancels any in-flight deploy; disabling auto-deploy
    # means deploys happen only on dashboard/manual trigger (or a dedicated
    # deploy workflow), so a code merge isn't silently killed by a follow-up
    # CI/docs push. See reference_render_concurrent_push_cancels_build memory.
    autoDeploy: false
    # Every entry here must match a path that actually exists. A `prisma/**`
    # entry lived here and matched nothing — the only schema is
    # apps/api/prisma/, already covered by `apps/api/**` — so it read as
    # coverage that was never there. pnpm-workspace.yaml + turbo.json ARE
    # build inputs (workspace resolution + task graph) and were unfiltered, so
    # editing them rebuilt neither service and prod kept serving an image built
    # against the previous workspace layout.
    renderBuildFilter:
      paths:
        - apps/api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
  # ─────────────────────────────────────────────────────────────────────────
  # Web (Next.js 15, standalone) — migrated off Cloudflare Workers 2026-07-07.
  # The OpenNext server-function bundle (5.3 MiB gzip) exceeded the free
  # Workers 3 MiB limit and the app uses no CF bindings in prod, so it self-
  # hosts on Render Node free tier via Next `output: 'standalone'`. The
  # Dockerfile builds standalone + copies static/public and runs `node server.js`.
  # NEXT_PUBLIC_* vars are baked at build time (set as build env in Render);
  # renderBuildFilter keeps web-only pushes from rebuilding the API (and vice-versa).
  - type: web
    name: darshya-web
    env: docker
    plan: free
    region: oregon
    dockerContext: .
    dockerfilePath: apps/web/Dockerfile
    healthCheckPath: /
    autoDeploy: false
    # NEXT_PUBLIC_* are publishable (non-secret). Render auto-translates `env`
    # keys to Docker build args (https://render.com/docs/docker), so the
    # Dockerfile's matching ARG declarations bake them into the Next client
    # bundle at build time. They're also present at runtime (harmless — public).
    # Real secrets (GITHUB_TOKEN, IVS_REPLAY_BUCKET_BASE, server-side keys) are
    # set in the Render dashboard as Secret env and are runtime-only (never
    # ARG-declared, so they never touch the image layers).
    #
    # NOTE: Render Blueprint uses `envVars:` (a list of {key,value}) for the
    # variable map — NOT `env:`. An earlier draft used `env:` here, which (a)
    # collided with the `env: docker` runtime-environment scalar key above
    # (YAML "duplicated mapping key" — the whole file failed to parse) and
    # (b) is not a valid Render Blueprint key. Fixed 2026-07-10. Render
    # auto-translates each envVar key into a Docker build ARG of the same name,
    # so the Dockerfile's matching ARG declarations bake NEXT_PUBLIC_* into the
    # Next client bundle at build time.
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://api.darshya.online
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://hlkvfarvfblhzhhnhtbp.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        value: sb_publishable_PxfldFRmHZGX9gG5bpOmaw_9pTKxNjc
      - key: NEXT_PUBLIC_ENV
        value: production
    # dockerContext is the repo root, so workspace resolution is a build input
    # here too — pnpm-workspace.yaml must trigger a rebuild.
    renderBuildFilter:
      paths:
        - apps/web/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - turbo.json
