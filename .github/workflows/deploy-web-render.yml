# Smoke-test the Render Node (standalone) build before any Render push.
# Context: the @opennextjs/cloudflare (Workers) path was abandoned 2026-07-07 —
# the OpenNext server-function bundle (5.3 MiB gzip) exceeded the free Workers
# 3 MiB limit. darshya web now self-hosts on Render Node free tier via Next
# `output: 'standalone'` (apps/web/Dockerfile). This workflow builds that exact
# Docker image and verifies `node server.js` boots and serves:
#   - framework routes: / , /sitemap.xml , /robots.txt , /api/orchestrator-status
#   - a legacy redirect: /kundli -> /astrology/kundli
#   - REAL prerendered [slug] pages: /jyotirlinga/somnath , /nava-graha/surya
#     (the prerender pipeline that broke under CF — proven here, not on Render)
#   - a /_next/static asset (proves .next/static was copied into standalone)
# so a broken standalone build is caught here, not on Render.
#
# Trigger: workflow_dispatch (manual) + on push to the migration branch while
# the cutover is being verified. After prod is live on Render, this becomes the
# web deploy gate (Render itself also builds, but CI smoke fails faster).
name: Smoke Render web build
on:
  workflow_dispatch:
  push:
    branches: [worktree-cf-opennext-migration]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-web-render.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the standalone image
        # Build context = repo root (the Dockerfile is at apps/web/Dockerfile
        # but COPYs workspace root files + sibling packages/ + tooling/, so the
        # context must be the repo root, not apps/web). Bake the production
        # NEXT_PUBLIC_* vars as --build-arg so the client bundle matches prod
        # (Dockerfile declares matching ARG + ENV so `next build` sees them).
        # Real secrets are runtime-only, never baked. The repo-root
        # .dockerignore keeps the context small.
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.darshya.online \
            --build-arg NEXT_PUBLIC_SUPABASE_URL=https://hlkvfarvfblhzhhnhtbp.supabase.co \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=sb_publishable_PxfldFRmHZGX9gG5bpOmaw_9pTKxNjc \
            --build-arg NEXT_PUBLIC_ENV=production \
            -f apps/web/Dockerfile \
            -t darshya-web:smoke \
            .

      - name: Boot server + smoke-test routes
        run: |
          # Run the image detached on a fixed host port; Render injects PORT
          # automatically, but here we set it explicitly so the container maps
          # 3000 -> host 3000.
          docker run -d --name web-smoke -p 3000:3000 -e PORT=3000 darshya-web:smoke
          # Wait for the standalone server to accept connections (up to 60s).
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/; then echo "server up after ${i}x2s"; break; fi
            sleep 2
          done
          fail=0
          check() {
            local path="$1" expect="$2"
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000${path}")
            if [ "$code" = "$expect" ]; then echo "PASS  $path -> $code"; else echo "FAIL  $path -> $code (expected $expect)"; fail=1; fi
          }
          check "/" 200
          check "/sitemap.xml" 200
          check "/robots.txt" 200
          check "/api/orchestrator-status" 200
          # Prerendered [slug] routes — the pipeline that broke under CF (the
          # original 3-week outage). These pages are prerendered at `next build`
          # from LOCAL static seed (apps/web/lib/jyotirlingas.ts, nava-grahas.ts)
          # via generateStaticParams — no live API needed, so they exist in the
          # image with no DB. Assert 200 AND a route-specific marker in the body,
          # so a stub/empty/404 page (which also returns 200) can't pass. This
          # proves the 1792-page prerender output actually serves from standalone.
          body_jy=$(curl -s "http://127.0.0.1:3000/jyotirlinga/somnath")
          code_jy=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/jyotirlinga/somnath")
          if [ "$code_jy" = "200" ] && echo "$body_jy" | grep -qi "somnath"; then
            echo "PASS  /jyotirlinga/somnath -> 200 (real prerendered HTML)"
          else echo "FAIL  /jyotirlinga/somnath -> $code_jy (expected 200 + 'somnath' marker in body)"; fail=1; fi
          body_ng=$(curl -s "http://127.0.0.1:3000/nava-graha/surya")
          code_ng=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/nava-graha/surya")
          if [ "$code_ng" = "200" ] && echo "$body_ng" | grep -qi "surya"; then
            echo "PASS  /nava-graha/surya -> 200 (real prerendered HTML)"
          else echo "FAIL  /nava-graha/surya -> $code_ng (expected 200 + 'surya' marker in body)"; fail=1; fi
          # Legacy redirect: /kundli -> /astrology/kundli. Next 15 App Router
          # emits 308 (permanent) for `permanent: true` redirects — accept 301
          # or 308; what matters is the destination.
          code_redir=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/kundli")
          loc=$(curl -s -o /dev/null -w "%{redirect_url}" "http://127.0.0.1:3000/kundli")
          if { [ "$code_redir" = "301" ] || [ "$code_redir" = "308" ]; } && echo "$loc" | grep -q "/astrology/kundli"; then
            echo "PASS  /kundli -> $code_redir /astrology/kundli"
          else echo "FAIL  /kundli -> $code_redir ($loc) (expected 301|308 -> /astrology/kundli)"; fail=1; fi
          # A static asset must resolve (proves .next/static was copied into standalone).
          asset=$(curl -s http://127.0.0.1:3000/ | grep -oE '/_next/static/[^"]+\.js' | head -1)
          if [ -n "$asset" ]; then
            acode=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000${asset}")
            if [ "$acode" = "200" ]; then echo "PASS  $asset -> 200"; else echo "FAIL  $asset -> $acode"; fail=1; fi
          else echo "FAIL  no /_next/static asset found on / (standalone static copy broken?)"; fail=1; fi
          echo "--- server logs (last 20) ---"
          docker logs --tail 20 web-smoke || true
          docker stop web-smoke >/dev/null 2>&1 || true
          exit $fail
