name: db-backup

# Daily Supabase Postgres pg_dump -> object store. 30-day retention.
#
# Schedule: 19:00 UTC (= 00:30 IST next day). Low-traffic window for India ops.
#
# ============================================================================
# WHAT THIS WORKFLOW HAS ACTUALLY DONE SO FAR: NOTHING. READ BEFORE TRUSTING IT.
# ============================================================================
# OPS-02. The required secrets have never been set, so every run since this
# workflow was created produced ZERO BYTES and reported a green tick. The script
# answered {"ok":true,"skipped":true} and the header here used to say the
# workflow "stays green so it doesn't spam the founder with failure emails". The
# intent was kind; the effect was that a product holding bookings, payments and
# 80G donation records believed it had daily backups while having none, for
# months, and nobody could discover that from the checkmark.
#
# Corrected 2026-08-20: a skip now FAILS the run (step "A skipped backup must
# not read as success", below).
# Extended 2026-08-21 (OPS-02/OPS-03): a run also fails when
#   - the dump is empty, too small, or not a readable pg_restore archive;
#   - the uploaded object cannot be read back at the expected size;
#   - the ONLY destination is the same Supabase project as the database
#     (OPS-03 — that is a second copy, not a backup).
#
# Extended 2026-09-04 — three ways to report a backup that did not exist had
# survived the 2026-08-21 pass, all of them in the wiring rather than in the
# checks it added:
#   - the read-back skipped its size comparison when the store reported the
#     object as 0 BYTES (`got > 0 && got !== expected` excluded the one value
#     that most needed to fail), and did the same when the HEAD carried no
#     content-length at all;
#   - the S3 offsite copy — the copy OPS-03 exists to create — was never read
#     back at all, yet reported a `verifiedBytes` field;
#   - the missing-credentials skip still returned `{"ok":true}` and exit 0 from
#     the script itself; only this workflow's grep caught it, so any other
#     caller was told the backup succeeded.
# The script now fails on all three, and distinguishes a MISSING pg_restore
# (stage "verify-tooling") from an UNREADABLE dump — a missing checker is not a
# corrupt artifact, and reporting it as one is how a real alarm gets ignored.
#
# Exit codes from supabase-backup.mjs, so a red run is diagnosable at a glance:
#   2 pg_dump failed          3 hashing failed        4 upload/read-back failed
#   5 destination refused     6 dump is not a restore point
#   7 NOT CONFIGURED          8 pg_restore missing, dump unverifiable
#   9 archive parses but is not a dump of THIS database (expected tables absent)
# 7 is the only one that means "nobody has set this up yet" rather than
# "something broke". Both mean there is no restore point for today.
#
# ---------------------------------------------------------------------------
# OWNER SETUP — three required secrets, and one optional set for offsite.
# ---------------------------------------------------------------------------
# GitHub -> repo Settings -> Secrets and variables -> Actions -> New repository
# secret. Names must match EXACTLY.
#
#   1. SUPABASE_DB_URL           Supabase -> Project Settings -> Database ->
#                                Connection string -> URI. Use the DIRECT
#                                connection (port 5432), NOT the pooled one
#                                (port 6543) — pg_dump needs a direct session.
#   2. SUPABASE_URL              Supabase -> Project Settings -> API -> Project
#                                URL, e.g. https://<ref>.supabase.co
#   3. SUPABASE_SERVICE_ROLE_KEY Supabase -> Project Settings -> API -> service_role
#                                key. Server-side only; never ship to a client.
#
# Optional but STRONGLY recommended (OPS-03 — otherwise the backup lives in the
# same account as the database and one suspension takes both):
#   BACKUP_S3_ENDPOINT           e.g. https://<accountid>.r2.cloudflarestorage.com
#   BACKUP_S3_BUCKET             e.g. darshya-db-backups
#   BACKUP_S3_ACCESS_KEY_ID
#   BACKUP_S3_SECRET_ACCESS_KEY
#   BACKUP_S3_REGION             optional; defaults to "auto" (correct for R2)
#   ALLOW_SAME_PROJECT_BACKUP    set to the literal string "true" ONLY to accept
#                                a same-project backup knowingly. The run then
#                                succeeds with a loud warning.
#   HEARTBEAT_URL                optional healthchecks.io URL (dead-man switch)
#
# HOW TO CONFIRM THE FIRST REAL BACKUP IS NON-EMPTY (do this once, by hand):
#   0. This file is on `main` already, so it IS dispatchable — but a dispatch
#      runs whichever copy lives on the branch you pick. The verification
#      guards described below only exist on the branch carrying them until it
#      merges, so run the dispatch against that branch, or merge first.
#   1. Actions -> db-backup -> "Run workflow" on the default branch.
#   2. The run must be GREEN. Open the "Run daily backup" step and read the
#      single JSON line. It must contain "ok":true, NO "skipped", a "sizeBytes"
#      in the millions, a "tocEntries" in the hundreds, "verified":true (the
#      store confirmed the byte count on read-back), and "offsite":true.
#   3. The job summary prints the same numbers. "0 bytes" or "skipped" is a
#      failure, and the run will be red.
#   4. Supabase -> Storage -> bucket db-backups -> backups/YYYY/MM/DD/ — the
#      object must be listed with a non-zero size matching "sizeBytes".
#   5. Then run the restore drill (below) once. A backup nobody has restored is
#      a hypothesis.
#
# NOTE: the schedule only fires from the repository's DEFAULT BRANCH. Edits made
# on a feature branch change nothing until they merge.
#
# Free-tier cost: 5 min x 30 runs/mo = 150 GH Actions minutes/mo, UNCHANGED by
# the 2026-08-21 additions (a `pg_restore --list` and one HEAD request are
# seconds). The restore-drill job below is workflow_dispatch-only and costs
# 0 scheduled minutes. See docs/free-tier-budgets.md.

on:
  schedule:
    # Daily at 19:00 UTC = 00:30 IST next day (cron uses UTC).
    - cron: '0 19 * * *'
  workflow_dispatch:
    inputs:
      restore_drill:
        description: 'Also run the restore drill (restores the newest dump into a throwaway Postgres and counts rows)'
        type: boolean
        default: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client (matches Supabase Postgres major)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # We don't need the full workspace — backup scripts are pure node:* +
      # native fetch. Skip pnpm install entirely to save ~2 min per run.

      # pg_restore is not optional tooling here: the integrity gate reads the
      # archive's table of contents with it. Without it the script fails at
      # stage "verify-tooling", which is correct but wastes a dump — check now.
      - name: Verify pg_dump and pg_restore available
        run: |
          pg_dump --version
          pg_restore --version

      - name: Run daily backup
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BACKUP_BUCKET: ${{ secrets.SUPABASE_BACKUP_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          ALLOW_SAME_PROJECT_BACKUP: ${{ secrets.ALLOW_SAME_PROJECT_BACKUP }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          # `set +e` is deliberate. GitHub runs `run:` under `bash -e`, so a
          # non-zero node exit would abort the step before the JSON is copied
          # anywhere and the assertion step below would have nothing to explain.
          # The exit code is preserved by hand on the last line.
          set +e
          set -uo pipefail
          node scripts/backup/supabase-backup.mjs > /tmp/backup-out.json 2>/tmp/backup-err.json
          code=$?
          cat /tmp/backup-out.json /tmp/backup-err.json
          # The script writes its failure JSON to stderr; keep whichever is
          # non-empty so the assertion below always has something to read.
          if [ ! -s /tmp/backup-out.json ]; then cp /tmp/backup-err.json /tmp/backup-out.json; fi
          exit $code

      # A SKIPPED BACKUP IS NOT A SUCCESSFUL BACKUP, AND NEITHER IS AN EMPTY ONE.
      #
      # `if: always()` so this reports even when the step above already failed —
      # otherwise the operator sees a bare non-zero exit with no explanation of
      # WHICH guard tripped.
      - name: Assert a real, verified, offsite backup was produced
        if: always()
        run: |
          set -uo pipefail
          if [ ! -s /tmp/backup-out.json ]; then
            echo "::error::The backup script produced no output at all."
            exit 1
          fi

          if grep -q '"skipped":[[:space:]]*true' /tmp/backup-out.json; then
            missing=$(grep -oE '"missing":\[[^]]*\]' /tmp/backup-out.json | head -1)
            echo "::error::NO BACKUP WAS TAKEN. The script skipped: ${missing}. There is no restore point for today."
            {
              echo "### No backup was taken"
              echo ""
              echo "\`supabase-backup.mjs\` skipped because required secrets are unset:"
              echo ""
              echo "\`\`\`"
              echo "${missing}"
              echo "\`\`\`"
              echo ""
              echo "**There is no restore point for today, and there may never have been one.**"
              echo "Set the three secrets named in the header of this workflow"
              echo "(Settings -> Secrets and variables -> Actions), then run this workflow"
              echo "manually and confirm it uploads a non-empty dump."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if ! grep -q '"ok":[[:space:]]*true' /tmp/backup-out.json; then
            stage=$(grep -oE '"stage":"[^"]*"' /tmp/backup-out.json | head -1)
            echo "::error::Backup failed at ${stage}. There is no restore point for today."
            {
              echo "### Backup failed"
              echo ""
              echo "\`\`\`json"
              cat /tmp/backup-out.json
              echo "\`\`\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          size=$(grep -oE '"sizeBytes":[0-9]+' /tmp/backup-out.json | head -1 | cut -d: -f2)
          toc=$(grep -oE '"tocEntries":[0-9]+' /tmp/backup-out.json | head -1 | cut -d: -f2)
          : "${size:=0}"
          : "${toc:=0}"
          if [ "$size" -le 0 ]; then
            echo "::error::Backup reported success with ${size} bytes. That is not a restore point."
            exit 1
          fi
          # Independent of the script's own MIN_TOC_ENTRIES gate. If a future
          # edit weakens that check, this still refuses to call an archive
          # nothing can enumerate a backup.
          if [ "$toc" -le 0 ]; then
            echo "::error::Backup reported success but pg_restore found 0 TOC entries. That file is not a readable archive."
            exit 1
          fi

          # "verified" is true only when EVERY destination confirmed the stored
          # byte count on read-back. False means the copies were written but a
          # store would not say what it holds — worth seeing, not worth a red
          # run, since a store that never returns content-length would make this
          # job permanently red and train everyone to ignore it.
          if grep -q '"verified":[[:space:]]*true' /tmp/backup-out.json; then
            verified="yes (size confirmed by read-back)"
          else
            verified="**NO — written, but the store did not confirm its size**"
            echo "::warning::At least one destination did not confirm the stored object size on read-back."
          fi

          {
            echo "### Backup verified"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| bytes | ${size} |"
            echo "| pg_restore TOC entries | ${toc} |"
            echo "| stored size confirmed | ${verified} |"
            if grep -q '"offsite":[[:space:]]*true' /tmp/backup-out.json; then
              echo "| offsite | yes |"
            else
              echo "| offsite | **NO — same account as the database** |"
            fi
            echo ""
            echo "These numbers prove the archive is READABLE and STORED. They do"
            echo "not prove it RESTORES — only the restore drill does that."
          } >> "$GITHUB_STEP_SUMMARY"

          if ! grep -q '"offsite":[[:space:]]*true' /tmp/backup-out.json; then
            echo "::warning::This backup is NOT offsite. It lives in the same Supabase project as the database it backs up, so one account action destroys both. Configure BACKUP_S3_* (Cloudflare R2 free tier)."
          fi

      - name: Prune backups older than 30 days
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BACKUP_BUCKET: ${{ secrets.SUPABASE_BACKUP_BUCKET }}
        run: node scripts/backup/prune-old-backups.mjs

  # ==========================================================================
  # RESTORE DRILL — the other half of OPS-02.
  #
  # "No restore has ever been recorded as tested" was literally true: the DR
  # drill history table in docs/runbooks/db-restore.md is empty. A dump nobody
  # has restored is a hypothesis, not a backup, and the failure modes it hides
  # (missing extension, ownership, a dump of the wrong database) only surface
  # during a restore.
  #
  # workflow_dispatch-only, so it costs ZERO scheduled minutes. Run it once
  # after the first real backup, then quarterly, and record the result in
  # docs/runbooks/db-restore.md -> "DR drill history".
  #
  # It restores into a throwaway Postgres SERVICE CONTAINER inside the runner —
  # it can never touch production, staging, or any Supabase project.
  # ==========================================================================
  restore-drill:
    if: github.event_name == 'workflow_dispatch' && inputs.restore_drill
    needs: backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: drill
          POSTGRES_DB: drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # KNOWN LIMIT: fetch-latest-backup.mjs reads the SUPABASE Storage bucket
      # only. If you follow the OPS-03 advice all the way and make R2 the ONLY
      # destination (no SUPABASE_URL), this step fails loudly with
      # "missing SUPABASE_URL" — it does not silently drill against nothing —
      # but the drill will need an S3 reader before it works in that setup.
      - name: Download the newest dump from the backup bucket
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BACKUP_BUCKET: ${{ secrets.SUPABASE_BACKUP_BUCKET }}
        run: node scripts/backup/fetch-latest-backup.mjs /tmp/drill.dump

      - name: Restore into the throwaway database
        env:
          PGPASSWORD: drill
        run: |
          set -euo pipefail
          # --no-owner/--no-privileges: the dump's roles do not exist here.
          #
          # A non-zero exit is EXPECTED and tolerated. A Supabase dump carries
          # `CREATE EXTENSION vector` (pgvector) and role grants that a stock
          # postgres:15 image cannot satisfy, so pg_restore always reports some
          # errors. Concretely, the three tables with an
          # `Unsupported("vector(1024)")` column — content_items, temples,
          # puja_types — will NOT restore here. That is a limitation of this
          # drill container, not of the dump.
          #
          # The row-count assertion below is therefore the real gate, and its
          # floor (50) sits well under the ~67 models in schema.prisma minus
          # those three. If you want a drill that restores 100% of the dump,
          # run the manual checklist in docs/runbooks/db-restore.md against a
          # throwaway Supabase project, which has pgvector.
          pg_restore --no-owner --no-privileges --jobs 2 \
            -h localhost -p 5432 -U postgres -d drill /tmp/drill.dump || true

      - name: Assert the restored database actually holds data
        env:
          PGPASSWORD: drill
        run: |
          set -euo pipefail
          tables=$(psql -h localhost -U postgres -d drill -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          users=$(psql -h localhost -U postgres -d drill -tAc \
            "SELECT count(*) FROM public.users" || echo 0)
          echo "tables=$tables users=$users"
          {
            echo "### Restore drill"
            echo ""
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| public tables restored | ${tables} |"
            echo "| rows in \`users\` | ${users} |"
            echo ""
            echo "Record this run in \`docs/runbooks/db-restore.md\` under **DR drill history**."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$tables" -lt 50 ]; then
            echo "::error::Only ${tables} tables restored. The dump is not a usable restore point."
            exit 1
          fi
