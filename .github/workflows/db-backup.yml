name: db-backup

# R-Q2-IT-003 — Daily Supabase Postgres pg_dump → object store (default
# Supabase Storage, S3-compatible swap via env). 30-day retention.
#
# Schedule: 19:00 UTC (= 00:30 IST next day). Low-traffic window for India ops.
#
# Founder-action required before this workflow produces useful artifacts:
#   1. Decide vendor (default Supabase Storage; R2/B2 alternative requires
#      CFO sign-off — see PR description for R-Q2-IT-003).
#   2. Create bucket `db-backups` in chosen vendor.
#   3. Set GH Actions secrets:
#        - SUPABASE_DB_URL              (use DIRECT_URL, NOT pooled — pg_dump
#                                        needs a direct session)
#        - SUPABASE_SERVICE_ROLE_KEY    (NEVER expose to client)
#        - SUPABASE_URL                 (e.g. https://abc.supabase.co)
#        - (optional) HEARTBEAT_URL     (healthchecks.io free tier)
#
# Until secrets land, both scripts no-op and exit 0 (skipped: missing-env).
# A SKIPPED BACKUP NOW FAILS THE RUN (corrected 2026-08-20). This header used
# to read "workflow stays green so it doesn't spam the founder" — and it did
# stay green, every day, while taking no backup at all because the secrets were
# never set. Silence is not kindness when the thing being silenced is "you have
# no restore point".
#
# Free-tier cost: 5 min × 30 runs/mo = 150 GH Actions minutes/mo.
# Current baseline ~1616/mo (per TASKS.md). Headroom intact within 1900 cap.

on:
  schedule:
    # Daily at 19:00 UTC = 00:30 IST next day (cron uses UTC).
    - cron: '0 19 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client (matches Supabase Postgres major)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client

      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      # We don't need the full workspace — backup scripts are pure node:* +
      # native fetch. Skip pnpm install entirely to save ~2 min per run.

      - name: Verify pg_dump available
        run: pg_dump --version

      - name: Run daily backup
        id: backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BACKUP_BUCKET: ${{ secrets.SUPABASE_BACKUP_BUCKET }}
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          set -uo pipefail
          node scripts/backup/supabase-backup.mjs | tee /tmp/backup-out.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"

      # A SKIPPED BACKUP IS NOT A SUCCESSFUL BACKUP.
      #
      # Until 2026-08-20 this workflow reported a green check every day for
      # producing ZERO BYTES: supabase-backup.mjs answers {"ok":true,
      # "skipped":true,"reason":"missing-env"} when the secrets are unset, and
      # the header above said "workflow stays green so it doesn't spam the
      # founder with failure emails". The intent was kind; the effect was that a
      # product holding bookings, payments and 80G donation records believed it
      # had daily backups while having none at all, for months. Nobody can
      # discover that from a green tick.
      #
      # So a skip now fails, loudly and once: the run goes red, and a single
      # deduped issue tracks it rather than 30 identical ones.
      - name: A skipped backup must not read as success
        run: |
          set -uo pipefail
          if grep -q '"skipped":[[:space:]]*true' /tmp/backup-out.json 2>/dev/null; then
            missing=$(grep -oE '"missing":\[[^]]*\]' /tmp/backup-out.json | head -1)
            echo "::error::NO BACKUP WAS TAKEN. The script skipped: ${missing}. There is no restore point for today."
            {
              echo "### ❌ No backup was taken"
              echo ""
              echo "\`supabase-backup.mjs\` skipped because required secrets are unset:"
              echo ""
              echo "\`\`\`"
              echo "${missing}"
              echo "\`\`\`"
              echo ""
              echo "**There is no restore point for today, and there may never have been one.**"
              echo "Set the secrets in Settings -> Secrets and variables -> Actions, then run"
              echo "this workflow manually and confirm it uploads a non-empty dump."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Backup produced output; see the step log for the uploaded object."


      - name: Prune backups older than 30 days
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BACKUP_BUCKET: ${{ secrets.SUPABASE_BACKUP_BUCKET }}
        run: node scripts/backup/prune-old-backups.mjs
