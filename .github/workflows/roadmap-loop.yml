name: Roadmap Orchestrator

on:
  schedule:
    # 2026-07-13: cut from every 8h (3/day) to every 12h (2/day). The 8h
    # cadence was chosen when the baseline was ~840 min/mo (8h×30×12 = 1080 +
    # 840 = 1920, safe). Since then db-backup (+150), onboarding-fleet-v2
    # (+90), cxo-advisory (+12), roadmap-finalize (+10) were added, pushing
    # the combined fleet to ~2160 min/mo — OVER the 2000 GH Actions cap by
    # ~160 (docs/free-tier-budgets.md reconciled table). Dropping to 2/day:
    # 12 × 2 × 30 = 720, total ~1800, ~200 headroom. The orchestrator is in
    # dry-run soak anyway (0 queue files written per cycle until the
    # sub-agent silent-failure bug is diagnosed), so 2 cycles/day is ample.
    #
    # REDUCED TO WEEKLY 2026-09-01. Two cycles a day is 12 x 2 x 30 = 720 min/mo,
    # which is 39% of the entire 2000-minute GitHub Actions allowance and by far
    # the largest single line in docs/free-tier-budgets.md. The note above is the
    # reason this is safe to cut rather than a reason to keep it: the orchestrator
    # is still in dry-run and still writes 0 queue files per cycle because of the
    # sub-agent silent-failure bug, so the 720 minutes buy nothing. 148 unread
    # dry-run items have accumulated in docs/roadmap/_dryrun/queue/, and the
    # engine's own tracker (docs/roadmap/_budget-snapshot.json) has been frozen at
    # "month": "2026-06" with ghMinutes.used: 0 since June.
    #
    # This matters beyond tidiness. OPS-09: ALL production monitoring rides on
    # this same quota, and it has been exhausted once already. A monitoring fleet
    # that dies because a dry-run loop ate the budget is how the 2026-08-17
    # outage went unnoticed for three days.
    #
    # Weekly costs ~48 min/mo, taking the fleet from ~1,853 to ~1,193 and turning
    # 147 minutes of headroom into roughly 800.
    #
    # TO RESTORE once the silent-failure bug is fixed and the soak resumes,
    # change this one line back to '17 */12 * * *' and re-check the total in
    # docs/free-tier-budgets.md first.
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (write to _dryrun/ paths, no live queue)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: roadmap-orchestrator
  cancel-in-progress: false

# Option 2-GH (orchestrator runs in GH Actions runner, NOT Render bg).
# 2026-06-12: Render bg-spawn proven unreliable on free tier (Render kills
# children on every push-triggered redeploy, env change, periodic rebalance).
# Cycles 1-9 all killed mid-execution. Solution: run orchestrator inside GH
# runner which has its own job lifecycle (60min timeout, no external restart).
#
# Required GH repo secrets:
#   ANTHROPIC_API_KEY                 Anthropic API key (PAID usage, not free tier)
#   SUPABASE_DIRECT_URL               Postgres conn for KPI scrape
#   DATABASE_URL_READONLY             Read-only role conn (preferred)
#   POSTHOG_PERSONAL_API_KEY          PostHog KPI scrape
#   POSTHOG_PROJECT_ID                PostHog project
#   RENDER_API_KEY                    Render KPI scrape (api health)
#   CF_ANALYTICS_TOKEN                Cloudflare KPI scrape
#   (GITHUB_TOKEN auto-provided for push)

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@10.33.0

      - name: Install root + scripts deps (workspace skip apps)
        run: pnpm install --frozen-lockfile --ignore-scripts --filter '!apps/*'

      - name: Run orchestrator
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || vars.ROADMAP_DRY_RUN || 'true' }}
          CYCLE_ID: 'C-${{ github.run_id }}'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          SUPABASE_DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
          DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY }}
          POSTHOG_PERSONAL_API_KEY: ${{ secrets.POSTHOG_PERSONAL_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: |
          set -e
          echo "Running orchestrator (DRY_RUN=$DRY_RUN, CYCLE_ID=$CYCLE_ID)"
          node scripts/agents/roadmap-orchestrator.mjs

      - name: Commit + push artifacts
        if: always() # commit alerts even on orchestrator failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "orchestrator-bot[bot]"
          git config user.email "orchestrator@bhaktisetu.local"
          git add docs/roadmap/ || true
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
            exit 0
          fi
          DRY_TAG=""
          if [ "${{ github.event.inputs.dry_run || vars.ROADMAP_DRY_RUN || 'true' }}" = "true" ]; then
            DRY_TAG=" (dryrun)"
          fi
          git commit -m "roadmap: orchestrator cycle C-${{ github.run_id }}${DRY_TAG} [skip ci]"
          git pull --rebase origin main || true
          git push origin HEAD:main
