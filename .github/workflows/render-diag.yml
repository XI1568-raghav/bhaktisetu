name: Render diag
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'services | deploy | both'
        required: false
        default: 'services'
      sid:
        description: 'service id (for deploy mode)'
        required: false
        default: ''
      did:
        description: 'deploy id (blank = list)'
        required: false
        default: ''
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Render
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
          SID: ${{ github.event.inputs.sid }}
          DID: ${{ github.event.inputs.did }}
        run: |
          set -uo pipefail
          A="Authorization: Bearer $RK"
          if [ "$MODE" = "services" ] || [ "$MODE" = "both" ]; then
            echo "=== ALL services (name + id, paginated) ==="
            cursor=""
            n=0
            while :; do
              url="https://api.render.com/v1/services?limit=20"
              [ -n "$cursor" ] && url="$url&cursor=$cursor"
              page=$(curl -s -H "$A" "$url")
              echo "$page" | jq -r '.[]? | "  \(.name)  id=\(.id)  status=\(.status // "null")"'
              cursor=$(echo "$page" | jq -r '.[-1:].cursor // empty' 2>/dev/null)
              cnt=$(echo "$page" | jq 'length')
              n=$((n+cnt)); [ "$cnt" -lt 20 ] && break
              [ -z "$cursor" ] && break
            done
            echo "total listed: $n"
            echo "=== darshya-web specifically ==="
            curl -s -H "$A" "https://api.render.com/v1/services" | jq '[.[] | select(.name=="darshya-web")] | length'
          fi
          if [ "$MODE" = "deploy" ] || [ "$MODE" = "both" ]; then
            echo "=== deploys for $SID ==="
            curl -s -H "$A" "https://api.render.com/v1/services/$SID/deploys?limit=3" | jq '.[]? | {id:.deploy.id, status:.deploy.status, createdAt:.deploy.createdAt}'
          fi
