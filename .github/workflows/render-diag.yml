name: Render diag
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'deploys | deploy | list | logs | logs2 | cftoken | detail | resume'
        required: false
        default: 'deploys'
      sid:
        description: 'service id'
        required: false
        default: 'srv-d970l2ks728c738fc33g'
      branch:
        description: 'branch to deploy (for clearCache)'
        required: false
        default: 'main'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: cftoken — verify the CF token in the GH secret + probe DNS scope
        if: ${{ github.event.inputs.mode == 'cftoken' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          AUTH="Authorization: Bearer ${CF_TOKEN}"
          # /user/tokens/verify returns the ACTIVE token's id + status (no extra
          # perms needed — any valid token verifies itself). That id is the
          # unambiguous match for the dashboard "bhaktisetu build token" row.
          echo "=== /user/tokens/verify (the secret token's own id) ==="
          v=$(curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/user/tokens/verify")
          echo "$v" | jq .
          tid=$(echo "$v" | jq -r '.result.id // empty')
          [ -n "$tid" ] && echo "SECRET_TOKEN_ID=$tid  (match this against the dashboard token's ID)"
          # DNS-records GET — same call render-cutover Step B2 makes. 403/10000 =
          # DNS:Edit still missing on THIS token for darshya.online. 200 = scope landed.
          zone=$(curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/zones?name=darshya.online" | jq -r '.result[0].id')
          echo "=== /zones/{zone}/dns_records?name=darshya.online (zone=$zone) ==="
          resp=$(curl -s -H "$AUTH" -w "\n%{http_code}" "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=darshya.online")
          code=$(printf '%s' "$resp" | tail -1); body=$(printf '%s' "$resp" | sed '$d')
          echo "HTTP $code"
          echo "$body" | jq .
          if [ "${code:0:1}" = "2" ] && echo "$body" | jq -e '.success' >/dev/null 2>&1; then
            echo "PASS  DNS:Edit scope present — re-fire render-cutover Step B2"
          else
            echo "FAIL  DNS still denied (HTTP $code). The 'bhaktisetu build token' (id=$tid) is what the secret uses — its Permissions MUST show 'Zone · DNS · Edit' with Zone Resource = darshya.online. If you edited a DIFFERENT token, the secret is unaffected."
          fi

      - name: list — enumerate all Render services (read-only, finds service IDs)
        if: ${{ github.event.inputs.mode == 'list' }}
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -uo pipefail
          A="Authorization: Bearer $RK"
          echo "=== all services (name, id, type, branch, url, lastDeploy) ==="
          curl -s -H "$A" "https://api.render.com/v1/services?limit=50" \
            | jq -r '.[] | (.service // .) | "\(.name)  id=\(.id)  type=\(.type // .env)  branch=\(.repoBranch // .autoDeploy // "n/a")  url=\(.serviceDetails.url // "n/a")  status=\(.status // "n/a")"'

      - name: detail — raw per-service JSON (suspended flag, suspenders, plan, updatedAt)
        if: ${{ github.event.inputs.mode == 'detail' }}
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ github.event.inputs.sid }}
        run: |
          set -uo pipefail
          A="Authorization: Bearer $RK"
          echo "=== GET /v1/services/$SID (raw) ==="
          curl -s -H "$A" "https://api.render.com/v1/services/$SID" \
            | jq '{name, id, type, suspended, suspenders, serviceDetails: (.serviceDetails | {url, plan, numInstances, region}), updatedAt, createdAt}'

      - name: resume — POST /v1/services/$SID/resume (unsuspend after monthly free-hours reset)
        if: ${{ github.event.inputs.mode == 'resume' }}
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ github.event.inputs.sid }}
        run: |
          set -uo pipefail
          A="Authorization: Bearer $RK"
          echo "=== POST /v1/services/$SID/resume ==="
          code=$(curl -s -o /tmp/resume.json -w "%{http_code}" -X POST -H "$A" "https://api.render.com/v1/services/$SID/resume")
          echo "HTTP $code"
          cat /tmp/resume.json
          echo ""
          echo "=== state after resume attempt ==="
          curl -s -H "$A" "https://api.render.com/v1/services/$SID" | jq '{name, suspended, suspenders}'

      - name: logs — fetch recent service runtime logs (shows prisma migrate + server start)
        if: ${{ github.event.inputs.mode == 'logs' }}
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ github.event.inputs.sid }}
        run: |
          set -uo pipefail
          A="Authorization: Bearer $RK"
          echo "=== last 80 service log lines for $SID ==="
          # Render service logs endpoint; limit + tail for the startup transcript
          raw=$(curl -s -H "$A" "https://api.render.com/v1/services/$SID/logs?limit=100")
          echo "$raw" | jq -r '.[]? // empty' 2>/dev/null | tail -80 || echo "$raw" | tail -80

      - name: deployEvents — read-only build transcript of last deploy (NO trigger)
        if: ${{ github.event.inputs.mode == 'deployEvents' }}
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ github.event.inputs.sid }}
        run: |
          set -uo pipefail
          A="Authorization: Bearer $RK"
          DEP=$(curl -s -H "$A" "https://api.render.com/v1/services/$SID/deploys?limit=1" | jq -r '.[0].deploy.id // .[0].id')
          echo "=== last deploy: $DEP — build events mentioning public/static/standalone/copy ==="
          RAW=$(curl -s -H "$A" "https://api.render.com/v1/services/$SID/deploys/$DEP/events?limit=300")
          echo "--- raw events shape (first entry) ---"
          echo "$RAW" | jq -c '.[0]' 2>/dev/null || echo "$RAW" | head -c 600
          echo "--- matching build lines ---"
          { echo "$RAW" | jq -r '.. | strings' 2>/dev/null || echo "$RAW"; } \
            | grep -iE "public|static|standalone|cp -r|test -d|server\.js|FATAL|copy" | tail -80 || true

      - name: deploys — read-only recent deploy history (NO trigger, zero build cost)
        if: ${{ github.event.inputs.mode == 'deploys' }}
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ github.event.inputs.sid }}
        run: |
          set -uo pipefail
          A="Authorization: Bearer $RK"
          echo "=== recent deploys for $SID (GET only — does NOT trigger a build) ==="
          RAW=$(curl -s -H "$A" "https://api.render.com/v1/services/$SID/deploys?limit=20")
          echo "$RAW" | jq -c '.[0]'  # raw first entry — reveals the wrapper shape
          echo "$RAW" | jq -r '.[] | (.deploy // .) | "\(.createdAt)  \(.status)  commit=\(.commit // "n/a")  id=\(.id)  cache=\(.clearCache // "n/a")"'
          echo "=== count by status (today's build burn) ==="
          curl -s -H "$A" "https://api.render.com/v1/services/$SID/deploys?limit=50" \
            | jq -r '[.[] | (.deploy // .)] | group_by(.status) | .[] | "\(.[0].status): \(length)"'

      - name: Trigger deploy + poll to live + curl
        if: ${{ github.event.inputs.mode == 'deploy' }}
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ github.event.inputs.sid }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          set -uo pipefail
          A="Authorization: Bearer $RK"
          echo "=== trigger fresh deploy (clearCache: clear to pick up Dockerfile change) ==="
          r=$(curl -s -X POST -H "$A" -H "Content-Type: application/json" \
            --data "{\"clearCache\":\"clear\"}" "https://api.render.com/v1/services/$SID/deploys")
          did=$(echo "$r" | jq -r '.id // .deploy.id // empty')
          echo "deployId=$did  response: $(echo "$r" | jq -c '{id:.id, status:.status}')"
          [ -n "$did" ] || { echo "FAIL no deploy id"; echo "$r" | jq .; exit 1; }
          echo "=== poll deploy to live (up to ~15min) ==="
          for i in $(seq 1 45); do
            st=$(curl -s -H "$A" "https://api.render.com/v1/services/$SID/deploys/$did" | jq -r '.status // "unknown"')
            echo "  [$i/45] $st"
            case "$st" in
              live) echo "PASS live"; break ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) echo "FAIL $st"; exit 1 ;;
            esac
            sleep 20
          done
          echo "=== curl the service URL (warm: retry on cold start) ==="
          url=$(curl -s -H "$A" "https://api.render.com/v1/services/$SID" | jq -r '.serviceDetails.url')
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 75 "$url/" || echo 000)
            echo "  warm $i: $code"; [ "$code" = "200" ] && break; sleep 20
          done
          echo "=== prerendered route + sitemap + asset ==="
          curl -s -o /dev/null -w "/jyotirlinga/somnath %{http_code}\n" --max-time 60 "$url/jyotirlinga/somnath"
          curl -s -o /dev/null -w "/sitemap.xml %{http_code}\n" --max-time 60 "$url/sitemap.xml"
          curl -s -o /dev/null -w "/api/orchestrator-status %{http_code}\n" --max-time 60 "$url/api/orchestrator-status"
