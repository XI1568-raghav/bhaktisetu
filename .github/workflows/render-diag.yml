name: Render diag
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'servicehealth'
        required: false
        default: 'servicehealth'
      sid:
        description: 'service id'
        required: false
        default: 'srv-d970l2ks728c738fc33g'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Render service health
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ github.event.inputs.sid }}
        run: |
          set -uo pipefail
          A="Authorization: Bearer $RK"
          echo "=== service object ==="
          curl -s -H "$A" "https://api.render.com/v1/services/$SID" | jq '{id,name,status:.status,suspended,serviceDetails:{url:.serviceDetails.url,runtime:.serviceDetails.runtime,plan:.serviceDetails.plan,healthCheckPath:.serviceDetails.healthCheckPath,env:.serviceDetails.env,dockerfilePath:.serviceDetails.envSpecificDetails.dockerfilePath,dockerContext:.serviceDetails.envSpecificDetails.dockerContext}}'
          echo "=== last 3 deploys (status + dates) ==="
          curl -s -H "$A" "https://api.render.com/v1/services/$SID/deploys?limit=3" | jq '.[]? | {id:.deploy.id, status:.deploy.status, createdAt:.deploy.createdAt, finishedAt:.deploy.finishedAt, trigger:.deploy.trigger}'
          echo "=== events (last 10 — crashes/health checks) ==="
          curl -s -H "$A" "https://api.render.com/v1/services/$SID/events?limit=10" | jq '.[]? | {createdAt, type, message:.message[0:200]}'
          echo "=== POST a fresh deploy (in case container died) ==="
          curl -s -X POST -H "$A" -H "Content-Type: application/json" --data '{}' "https://api.render.com/v1/services/$SID/deploys" | jq '{id, status}'
