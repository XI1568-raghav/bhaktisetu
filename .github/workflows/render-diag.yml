name: Render diag
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'cfdns | render'
        required: false
        default: 'cfdns'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe
        env:
          CF_T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RK: ${{ secrets.RENDER_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -uo pipefail
          if [ "$MODE" = "cfdns" ]; then
            CFA="Authorization: Bearer $CF_T"
            zone=$(curl -s -H "$CFA" "https://api.cloudflare.com/client/v4/zones?name=darshya.online" | jq -r '.result[0].id')
            echo "zone=$zone"
            for NAME in darshya.online www.darshya.online; do
              echo "--- DNS records for $NAME (raw HTTP status + body) ---"
              code=$(curl -s -o /tmp/r.json -w "%{http_code}" -H "$CFA" "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=$NAME")
              echo "HTTP $code"
              jq '{success, count:(.result|length), records:[.result[]? | {id,type,name,content,proxied}]}' /tmp/r.json
            done
            echo "=== ALL records in zone (first 30) ==="
            curl -s -H "$CFA" "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?per_page=30" | jq -r '.result[]? | "  \(.type) \(.name) -> \(.content)  proxied=\(.proxied)  id=\(.id)"'
          fi
