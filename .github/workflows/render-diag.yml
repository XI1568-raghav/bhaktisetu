name: Render diag
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'logs'
        required: false
        default: 'logs'
      sid:
        description: 'service id'
        required: false
        default: 'srv-d970l2ks728c738fc33g'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Render service logs
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
          SID: ${{ github.event.inputs.sid }}
        run: |
          set -uo pipefail
          A="Authorization: Bearer $RK"
          echo "=== latest deploy id ==="
          did=$(curl -s -H "$A" "https://api.render.com/v1/services/$SID/deploys?limit=1" | jq -r '.[0].deploy.id')
          echo "deployId=$did"
          echo "=== service logs (GET /services/{id}/logs) ==="
          curl -s -H "$A" "https://api.render.com/v1/services/$SID/logs?limit=50" | jq -r '.[]? | (.timestamp // .createdAt // "?") + " " + (.message // .text // (. | tostring))' 2>/dev/null | tail -40
          echo "=== RAW service logs first 1500 ==="
          curl -s -H "$A" "https://api.render.com/v1/services/$SID/logs?limit=20" | head -c 1500
          echo ""
          echo "=== deploy logs (GET /services/{id}/deploys/{did}/logs) ==="
          curl -s -H "$A" "https://api.render.com/v1/services/$SID/deploys/$did/logs?limit=50" | jq -r '.[]? | (.timestamp // .createdAt // "?") + " " + (.message // .text // (. | tostring))' 2>/dev/null | tail -40
          echo "=== RAW deploy logs first 1500 ==="
          curl -s -H "$A" "https://api.render.com/v1/services/$SID/deploys/$did/logs?limit=20" | head -c 1500
