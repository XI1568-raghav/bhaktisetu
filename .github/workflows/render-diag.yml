name: Render diag
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'cferrors | cfdns'
        required: false
        default: 'cferrors'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe
        env:
          CF_T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -uo pipefail
          CFA="Authorization: Bearer $CF_T"
          zone=$(curl -s -H "$CFA" "https://api.cloudflare.com/client/v4/zones?name=darshya.online" | jq -r '.result[0].id')
          echo "zone=$zone"
          echo "=== verify token (which scopes does it have?) ==="
          curl -s -H "$CFA" "https://api.cloudflare.com/client/v4/user/tokens/verify" | jq '{success, status:.result.status, permissions:.result.policies}'
          echo "=== full 403 errors body for dns_records GET ==="
          curl -s -H "$CFA" "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=darshya.online" | jq '{success, errors}'
          echo "=== try a POST dns_records (dry: invalid to see auth error not validation) ==="
          curl -s -X POST -H "$CFA" -H "Content-Type: application/json" --data '{"type":"TXT","name":"darshya.online","content":"probe"}' "https://api.cloudflare.com/client/v4/zones/$zone/dns_records" | jq '{success, errors}'
