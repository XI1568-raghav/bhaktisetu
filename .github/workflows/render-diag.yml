name: Render diag
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'rawshape | services'
        required: false
        default: 'rawshape'
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Render
        env:
          RK: ${{ secrets.RENDER_API_KEY }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -uo pipefail
          A="Authorization: Bearer $RK"
          echo "=== RAW services list first 1200 chars ==="
          curl -s -H "$A" "https://api.render.com/v1/services?limit=3" | head -c 1200
          echo ""
          echo "=== top-level keys of first element ==="
          curl -s -H "$A" "https://api.render.com/v1/services?limit=3" | jq '.[0] | keys'
          echo "=== try .[0].service vs .[0] flat ==="
          curl -s -H "$A" "https://api.render.com/v1/services?limit=3" | jq '{asFlat: {name:.[0].name, id:.[0].id}, asService: {name:.[0].service.name, id:.[0].service.id}}'
          echo "=== names via .service.name ==="
          curl -s -H "$A" "https://api.render.com/v1/services?limit=20" | jq -r '.[]?.service.name // "WRAP_FAIL"' | head -20
