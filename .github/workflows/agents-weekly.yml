name: Agent fleet - weekly

# Weekly batch: investor pipeline + PR outreach + 18 agents moved from daily
# (SEO, content, growth, social, onboarding, competitor, keyword, schema, etc).
# Free tier: ~10 min/run × 4/mo = 40 min/month. See docs/free-tier-budgets.md.
# Monday 04:00 UTC = 09:30 IST.

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run weekly agents
        env:
          API_BASE: ${{ secrets.API_BASE_URL || 'https://api.darshya.online' }}
          WEB_BASE: ${{ secrets.WEB_BASE_URL || 'https://darshya.online' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          node scripts/agents/run-all.mjs \
            investor-pipeline pr-outreach \
            seo-audit content-pipeline lead-gen growth-metrics \
            social-queue onboarding-drip gsc-submitter \
            review-harvest competitor-watch rss-to-thread \
            seo-internal-linker competitor-feature-watcher \
            keyword-rank-tracker x-engagement-digest \
            weekly-investor-update schema-validator backlinks-monitor

      - name: Commit reports
        run: |
          git config user.name "darshya-agent-bot"
          git config user.email "agents@darshya.online"
          git pull --rebase --autostash || true
          git add docs/agent-reports/ || true
          if git diff --cached --quiet; then
            echo "No artifact change."
          else
            git commit -m "chore(agents): weekly run $(date -u +%Y-%m-%d)"
            git push
          fi
