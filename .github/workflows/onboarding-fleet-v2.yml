name: Onboarding Fleet v2

on:
  schedule:
    - cron: '23 9 * * *'   # 09:23 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: onboarding-fleet-v2
  cancel-in-progress: false

jobs:
  drip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile --filter=!@poojly/web --filter=!@poojly/api --prefer-offline
      - run: node scripts/agents/onboarding-v2/run-all.mjs
      - name: Commit drafts + state
        run: |
          git config user.name "onboarding-fleet-v2[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs/agent-reports/
          if ! git diff --cached --quiet; then
            git commit -m "onboard: daily drip $(date -u +%Y-%m-%d) [skip ci]"
            git pull --rebase
            git push
          fi
