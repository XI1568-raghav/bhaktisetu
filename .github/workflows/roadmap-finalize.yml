name: Roadmap Finalize

on:
  push:
    branches: [main]
    # Only run when roadmap-relevant files change. Prevents re-running on
    # every docs-only / agent-report-only push that has no [skip ci].
    # NOTE: GitHub Actions rejects `paths` + `paths-ignore` together when the
    # ignore entries are subsets of `paths` entries (instant "workflow file
    # issue" 0s fail). The self-loop guard (don't re-run on done/** /
    # _alerts/** commits) is handled by finalize.mjs itself — it only moves
    # files when a commit carries a `Closes: Q-…` trailer, so a done-only or
    # alerts-only commit is a natural no-op (moved=0).
    paths:
      - 'docs/roadmap/**'
      - 'scripts/agents/roadmap/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: roadmap-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - run: pnpm install --frozen-lockfile --filter=!@poojly/web --filter=!@poojly/api --prefer-offline
      - run: node scripts/agents/roadmap/finalize.mjs
      - name: Commit moves
        run: |
          git config user.name "roadmap-finalize[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add docs/roadmap/
          if ! git diff --cached --quiet; then
            git commit -m "roadmap: finalize closed queue items [skip ci]"
            git pull --rebase
            git push
          fi
