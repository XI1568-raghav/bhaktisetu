name: E2E (Playwright)

# Free-tier budget: schedule + manual ONLY. The pull_request trigger was
# removed (2026-07-10): it ran ~15 min of non-gating E2E against PROD on
# every PR, burning ~75+ min/mo to test already-deployed code rather than
# the PR's own code (no PR-preview infra exists — see P2-36 in fix-spec.md).
# It now catches prod regression on the weekly Sun 04:00 UTC schedule +
# manual runs only. See docs/free-tier-budgets.md.
#
# OPS-01 — `continue-on-error: true` was set here twice, at job level and
# again on the test step, so this workflow could not report a failure. The
# stated reason was "must NOT gate PRs", but the `pull_request` trigger had
# already been removed on 2026-07-10: with no PR trigger there is nothing to
# gate, and the flags only suppressed the one thing the workflow exists to
# say. On 2026-08-17 Render suspended both services, prod served 503 for
# three days, and this run — like the health smoke — stayed green.
# Both flags are removed. A red weekly E2E now means prod is broken; that is
# the point. If a specific spec is genuinely flaky against prod, quarantine
# THAT spec (test.fixme / a skip annotation), never the whole workflow.

on:
  schedule:
    # Weekly Sun 04:00 UTC. Catches prod regression independent of pushes.
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL for Playwright tests'
        required: false
        default: 'https://darshya.online'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright against ${{ inputs.base_url || 'https://darshya.online' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLAYWRIGHT_BASE_URL: ${{ inputs.base_url || 'https://darshya.online' }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run Playwright (TD2 specs)
        run: pnpm exec playwright test tests/e2e --reporter=html,list

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report
          retention-days: 14

      - name: Upload test-results (traces, screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ github.run_id }}
          path: test-results
          retention-days: 7
