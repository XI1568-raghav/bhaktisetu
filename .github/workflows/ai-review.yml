name: AI Code Review

# Automated code review on PRs (P4.21). Claude reviews the diff against the
# darshya-code-review checklist and the script posts the findings as a comment.
# Advisory — exit 0 regardless of verdict: the COMMENT is the gate (a human reads
# it), not the workflow status. This prevents an API outage from blocking
# unrelated PR checks. Runs only on PRs touching code/migrations/config.
#
# Free-tier budget: ~2 min/run × ~15 PRs/mo = 30 min/mo. Well under 5% of the
# 2000 min/mo GH Actions budget. See darshya-free-tier-check skill.
#
# Credentials — set ONE repo secret. Until one is set the script reviews
# nothing and says so in the PR.
#   CLAUDE_CODE_OAUTH_TOKEN  a Claude subscription (preferred: no per-token
#                            bill, it counts against the subscription's usage).
#                            Create it with `claude setup-token`, then
#                            `gh secret set CLAUDE_CODE_OAUTH_TOKEN`.
#   ANTHROPIC_API_KEY        the Anthropic API, billed per token. Used only
#                            when the subscription token is absent.
#   (GITHUB_TOKEN auto-provided, has comment permission on PRs)
#
# One review is one request of at most ~30k input tokens on the cheapest
# Claude model.
#
# Optional repo VARIABLES (not secrets):
#   PR_REVIEW_MODELS    comma-separated Claude model ids, tried in order
#   ANTHROPIC_BASE_URL  only if requests must go somewhere other than
#                       https://api.anthropic.com
#
# Re-review an existing PR by hand (also how an oversized PR gets reviewed):
#   gh workflow run ai-review.yml -f pr_number=<N>

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'prisma/**'
      - 'packages/**'
      - '.github/workflows/**'
      - 'scripts/agents/**'
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: string

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: Review diff
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      # Secrets cannot be read in a step's `if`, so expose only whether it exists.
      HAS_SUBSCRIPTION_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate diff context

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Only needed for the subscription path. Pinned so a CLI release cannot
      # change the reviewer's behaviour unreviewed; continue-on-error because a
      # registry hiccup must not fail an advisory check — the script reports a
      # missing CLI in the PR comment instead.
      - name: Install Claude Code CLI
        if: env.HAS_SUBSCRIPTION_TOKEN == 'true'
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code@2.1.289

      - name: Run AI review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          PR_REVIEW_MODELS: ${{ vars.PR_REVIEW_MODELS }}
        run: node scripts/agents/pr-review.mjs
