name: Agent fleet - health smoke (12h)

# Hits prod twice daily with full role smoke. Writes timestamped report.
# Free tier: ~3 min/run × 2/day × 30 = 180 min/month (was 360 at 6h).
# See docs/free-tier-budgets.md.

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run health smoke
        env:
          API_BASE: ${{ secrets.API_BASE_URL || 'https://api.darshya.online' }}
          WEB_BASE: ${{ secrets.WEB_BASE_URL || 'https://darshya.online' }}
        run: node scripts/agents/health-smoke.mjs

      - name: Commit report
        run: |
          git config user.name "darshya-agent-bot"
          git config user.email "agents@darshya.online"
          git pull --rebase --autostash || true
          git add docs/agent-reports/ || true
          if git diff --cached --quiet; then
            echo "No artifact change."
          else
            git commit -m "chore(agents): health smoke $(date -u +%Y-%m-%dT%H)"
            git push
          fi
