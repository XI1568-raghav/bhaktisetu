name: CI

# Single-job CI. Free-tier budget: ~4 min/run (was ~11 min as 3 jobs × pnpm install).
# Path-filtered so docs-only commits don't burn minutes. See docs/free-tier-budgets.md.

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'TASKS.md'
      - 'ROADMAP.md'
      - 'PROJECT_CONTEXT.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'TASKS.md'
      - 'ROADMAP.md'
      - 'PROJECT_CONTEXT.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint + Type + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @poojly/api exec prisma generate

      - name: Lint
        run: pnpm turbo lint --filter=!@poojly/remotion-pitch

      - name: Type Check
        run: pnpm turbo type-check --filter=!@poojly/remotion-pitch

      - name: Test
        run: pnpm turbo test --filter=!@poojly/remotion-pitch

      - name: Build
        run: pnpm turbo build --filter=!@poojly/remotion-pitch

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/web/.next
            apps/admin/.next
            apps/api/dist
          retention-days: 7
