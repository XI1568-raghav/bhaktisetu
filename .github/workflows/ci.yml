name: CI

# Single-job CI. Free-tier budget: ~4 min/run (was ~11 min as 3 jobs × pnpm install).
# Path-filtered so docs-only commits don't burn minutes. See docs/free-tier-budgets.md.

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'TASKS.md'
      - 'ROADMAP.md'
      - 'PROJECT_CONTEXT.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'TASKS.md'
      - 'ROADMAP.md'
      - 'PROJECT_CONTEXT.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint + Type + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup@v4 reads the `packageManager` pin (pnpm@10.33.0)
      # from package.json automatically. Do NOT set `version` — that input
      # was deprecated and causes an immediate setup error on newer v4 builds
      # (the 4-5s "setup failed" symptom seen on the last 6 main runs).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # package.json engines: ">=20.0.0". Pin 20.x LTS for free-tier
          # stability and so setup-node's pnpm cache init finds pnpm on PATH.
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @poojly/api exec prisma generate

      - name: Lint
        run: pnpm turbo lint --filter=!@poojly/remotion-pitch

      - name: Type Check
        run: pnpm turbo type-check --filter=!@poojly/remotion-pitch

      - name: Test
        run: pnpm turbo test --filter=!@poojly/remotion-pitch

      # OPS-01 / OPS-06 guards. `turbo test` is per-package and the repo-root
      # vitest project (which owns `scripts/**/*.test.mjs`) is not in the task
      # graph, so nothing under scripts/ has ever run in CI. These three files
      # assert that the production monitors can still report failure and that
      # the rollback lever the runbook depends on still exists - guards that
      # never run are exactly the class of defect being fixed here.
      #
      # Named explicitly rather than running `vitest run scripts/`: seven other
      # files under scripts/ fail on a clean tree today (five are plain scripts
      # with no vitest suite in them, so vitest errors "No test suite found").
      # Running the whole directory would red CI for pre-existing reasons and
      # the step would be deleted within a day. Fixing those is tracked
      # separately; widen this glob once they pass.
      #
      # The two backup files were added to this list on 2026-08-21 (OPS-02 /
      # OPS-03). `scripts/backup/test/backup.test.mjs` had existed since
      # 2026-06-14 and had never executed anywhere: not in `turbo test` (wrong
      # project), not here (not named). The guard on the one script that decides
      # whether this product has a restore point was dead the whole time.
      #
      # Windows note for whoever runs these locally: the three
      # `scripts/backup/*.mjs` files were CRLF in the working tree until
      # 2026-08-21, and vitest's transform fails on a CRLF `.mjs` with
      # `SyntaxError: Invalid or unexpected token` pointing at the IMPORT line
      # in the test rather than at the module. `.gitattributes` already says
      # `* text=auto eol=lf`, so the index was always LF and CI was never
      # affected — only the Windows checkout. If it reappears, re-run
      # `git add --renormalize .`.
      #
      # Two more added 2026-08-28 (OPS-02/03/08/10/11):
      #   scripts/test/ops-runbook-honesty.test.mjs — asserts the ops runbooks
      #     still name the three backup secrets, still dispatch the guarded copy
      #     of db-backup.yml, still document the offsite restore path, and that
      #     the superseded multi-region/DR documents stay marked superseded.
      #   scripts/test/secret-scan.test.mjs — the OPS-11 pre-commit credential
      #     scanner, plus assertions that .githooks/pre-commit actually invokes
      #     it before its early exit and that the root `prepare` installs hooks.
      #
      # KNOWN GAP, stated rather than papered over: this workflow carries
      # `paths-ignore: docs/**, **/*.md`, so a DOCS-ONLY pull request skips it
      # and the runbook assertions do not run. They run on any PR that also
      # touches code, and the secret-scan half is code either way. Widening the
      # filter would cost ~5 min of free-tier budget per docs commit
      # (docs/free-tier-budgets.md), which is why it was not done here.
      #
      # ~12s on an already-installed runner => ~16 min/mo at ~80 runs.
      - name: Ops guards (production monitoring + rollback lever + backups)
        run: >-
          pnpm exec vitest run
          scripts/agents/health-smoke.test.mjs
          scripts/agents/prod-monitoring-can-fail.test.mjs
          scripts/agents/deploy-rollback-lever.test.mjs
          scripts/backup/test/backup.test.mjs
          scripts/backup/test/backup-integrity.test.mjs
          scripts/test/ops-runbook-honesty.test.mjs
          scripts/test/secret-scan.test.mjs

      - name: Build
        run: pnpm turbo build --filter=!@poojly/remotion-pitch

      - name: MCP smoke check
        # Builds @darshya/mcp and asserts the stdio server boots + responds to
        # tools/list with all 6 tools. The server calls loadEnv() lazily (only
        # when a DB tool runs), so tools/list works on CI even without
        # DIRECT_URL. Catches a broken server build or a tool-registration
        # regression that the unit tests (which mock the SDK transport) can't.
        # ~20s/run — within the free-tier budget.
        run: pnpm mcp:smoke

      - name: Upload Build Artifacts
        # Non-fatal: this is a convenience step (save build output for download),
        # NOT a quality gate — lint/type/test/build above already passed. On the
        # free tier the GitHub Actions artifact-storage quota (2 GB) gets
        # exhausted by 7-day retention of multi-package .next/dist dirs and
        # "Failed to CreateArtifact: Artifact storage quota has been hit" then
        # reddens the whole CI for 6-12h until usage is recalculated. That masks
        # the real (green) result and blocks required-checks/PR merges. So let a
        # quota/upload failure degrade gracefully (artifact simply unavailable)
        # instead of failing the run. Re-enable hard-fail if/when on a paid plan.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/web/.next
            apps/admin/.next
            apps/api/dist
          retention-days: 7
