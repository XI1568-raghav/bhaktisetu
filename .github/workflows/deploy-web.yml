name: Deploy Web to Cloudflare Workers

# Migrated 2026-07-07 from @cloudflare/next-on-pages (Pages, archived/dead —
# couldn't build Next 15.5.x) to @opennextjs/cloudflare (Workers). The build
# runs `opennextjs-cloudflare build` (→ .open-next/worker.js + assets) and the
# deploy runs `opennextjs-cloudflare deploy` (→ `wrangler deploy`, Workers).
# See apps/web/wrangler.jsonc (name: darshya, main: .open-next/worker.js).
#
# Free-tier: manual-only. GH Actions cap is conserved — this fires only from
# the Actions tab. Keep for emergency/manual redeploy. See
# docs/free-tier-budgets.md.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check + tests (gate)
        working-directory: apps/web
        run: |
          pnpm run type-check
          pnpm run test

      - name: Build for Cloudflare Workers (OpenNext)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.darshya.online
          NEXT_PUBLIC_SUPABASE_URL: https://hlkvfarvfblhzhhnhtbp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_PxfldFRmHZGX9gG5bpOmaw_9pTKxNjc
        run: pnpm run cf:build

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy
