name: Deploy Web to Cloudflare Workers

# Migrated 2026-07-07 from @cloudflare/next-on-pages (Pages, archived/dead —
# couldn't build Next 15.5.x) to @opennextjs/cloudflare (Workers). The build
# runs `opennextjs-cloudflare build` (→ .open-next/worker.js + assets) and the
# deploy runs `opennextjs-cloudflare deploy` (→ `wrangler deploy`, Workers).
# See apps/web/wrangler.jsonc (name: darshya, main: .open-next/worker.js).
#
# Free-tier: manual-only. GH Actions cap is conserved — this fires only from
# the Actions tab. Keep for emergency/manual redeploy. See
# docs/free-tier-budgets.md.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check + tests (gate)
        working-directory: apps/web
        run: |
          pnpm run type-check
          pnpm run test

      - name: Build for Cloudflare Workers (OpenNext)
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.darshya.online
          NEXT_PUBLIC_SUPABASE_URL: https://hlkvfarvfblhzhhnhtbp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_PxfldFRmHZGX9gG5bpOmaw_9pTKxNjc
        run: pnpm run cf:build

      - name: Analyze bundle size (diagnostic)
        working-directory: apps/web
        if: always()
        run: |
          echo "=== OpenNext server-function bundle composition (target: <3 MiB gzip free-tier) ==="
          echo "--- handler.mjs raw + gzip size ---"
          ls -lh .open-next/server-functions/default/apps/web/handler.mjs 2>/dev/null || echo "(no handler)"
          gzip -c .open-next/server-functions/default/apps/web/handler.mjs 2>/dev/null | wc -c \
            | awk '{printf "handler.mjs gzip: %.2f KiB\n", $1/1024}'
          echo "--- top 20 largest files under .open-next/server-functions (excl .pnpm) ---"
          find .open-next/server-functions -type f -not -path "*/node_modules/.pnpm/*" 2>/dev/null \
            | xargs du -k 2>/dev/null | sort -rn | head -20
          echo "--- esbuild metafile: top 30 INLINED modules by bytes (handler.mjs.meta.json) ---"
          node -e '
            const fs=require("fs"),path=require("path");
            const m=path.join(".open-next/server-functions/default/apps/web/handler.mjs.meta.json");
            if(!fs.existsSync(m)){console.log("(no meta.json)");process.exit(0);}
            const d=JSON.parse(fs.readFileSync(m,"utf8"));
            // esbuild metafile: outputs[file].inputs = { path: { bytesInOutput } }
            const byInp={};
            for(const [o,v] of Object.entries(d.outputs||{})){
              const ins=v.inputs||{};
              for(const [p,info] of Object.entries(ins)){
                const b=(info&&info.bytesInOutput)||0;
                byInp[p]=(byInp[p]||0)+b;
              }
            }
            const top=Object.entries(byInp).sort((a,b)=>b[1]-a[1]).slice(0,35);
            let tot=0;for(const[,b] of Object.entries(byInp))tot+=b;
            console.log(`total inlined bytes across ${Object.keys(byInp).length} modules: ${(tot/1048576).toFixed(1)} MiB`);
            for(const [p,b] of top) console.log(`${(b/1024).toFixed(0).padStart(7)} KiB  ${p}`);
          '
          echo "--- bundled node_modules: top 15 by size ---"
          (du -sm .open-next/server-functions/default/node_modules/* 2>/dev/null; du -sm .open-next/server-functions/default/apps/web/node_modules/* 2>/dev/null) | sort -rn | head -15


      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec opennextjs-cloudflare deploy

