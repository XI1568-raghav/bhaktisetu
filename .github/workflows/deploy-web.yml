name: Deploy Web to Cloudflare Pages

# Free-tier: manual-only. CF Pages git integration deploys on push to main
# from the CF dashboard side (free 500 builds/mo). This workflow duplicated
# the build and burned ~6 min/push of GH Actions cap. Keep for emergency
# manual redeploy from the Actions tab. See docs/free-tier-budgets.md.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Pages
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.darshya.online
          NEXT_PUBLIC_SUPABASE_URL: https://hlkvfarvfblhzhhnhtbp.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_PxfldFRmHZGX9gG5bpOmaw_9pTKxNjc
        run: pnpm exec next-on-pages

      - name: Deploy to Cloudflare Pages
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy .vercel/output/static --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME || 'darshya' }} --branch=main
