name: Agent fleet - daily (critical 6)

# Daily critical-only set. Rest moved to agents-weekly.yml to fit free tier.
# Free tier: ~2 min/day = 60 min/month against 2000-min ceiling.
# See docs/free-tier-budgets.md.

on:
  schedule:
    # 03:30 UTC = 09:00 IST — fits founder morning review
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: comma-separated agent names to run (default: all daily)'
        required: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run agent fleet (daily set)
        env:
          API_BASE: ${{ secrets.API_BASE_URL || 'https://api.darshya.online' }}
          WEB_BASE: ${{ secrets.WEB_BASE_URL || 'https://darshya.online' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
        run: |
          AGENTS="${{ github.event.inputs.only }}"
          if [ -z "$AGENTS" ]; then
            # Critical daily: uptime, broken-link, founder-tweet, content-pub,
            # agent-issue-filer, weekly-digest (Sun-only internal). All others
            # moved to agents-weekly.yml. See docs/free-tier-budgets.md.
            node scripts/agents/run-all.mjs uptime-pinger broken-link founder-tweet-draft content-publisher agent-issue-filer weekly-digest
          else
            node scripts/agents/run-all.mjs $(echo "$AGENTS" | tr ',' ' ')
          fi

      - name: Commit reports
        run: |
          git config user.name "darshya-agent-bot"
          git config user.email "agents@darshya.online"
          git add docs/agent-reports/ || true
          if git diff --cached --quiet; then
            echo "No new agent artifacts to commit."
          else
            git commit -m "chore(agents): daily fleet run $(date -u +%Y-%m-%d)"
            git push
          fi
