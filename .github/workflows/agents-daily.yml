name: Agent fleet - daily (critical 10)

# Daily critical-only set. Rest moved to agents-weekly.yml to fit free tier.
# Free tier: ~3.5 min/day = 105 min/month against 2000-min ceiling.
# See docs/free-tier-budgets.md.
#
# Killed 2026-05-28 per Sprint 2 sub-batch 1 audit (silent-failure agents):
#   - uptime-pinger (no artifact in recent reports)
#   - agent-issue-filer (no GH issues filed despite probe rate)
#
# Added 2026-05-28 per Sprint 2 sub-batch 2 (Wave 1 ops agents):
#   - booking-quality-monitor (SLA breach detector, files P0 GH issues)
#   - onboarding-nudge (24h/72h/7d KYC abandon recovery)
#   - support-intent-triage (refund/abuse → P0; bucket the rest)
#
# Added 2026-05-28 per Sprint 2 sub-batch 3 (Wave 2 acquisition/retention):
#   - cold-temple-outreach (25/day partnership emails to NEW TEMPLE leads)
#   - referral-nudge (7-day post-first-booking referral hook)
#   - dormant-reactivation (Wed-only, nakshatra-personalised rebook)
#
# Added 2026-05-28 per Sprint 3 sub-batch 3 (Wave 3 broadcast + analytics):
#   - daily-devotional-broadcast (WA-primary daily message — Resend cap protect)
#   - funnel-drop-analyzer (daily funnel-health → files P0 GH issue on >70% drop)
#   - social-content-multiplexer (3-channel content pack — SUPERSEDES founder-tweet-draft + content-publisher; both removed below)
#   - investor-weekly-digest-v2 (Sun-only real-numbers digest from /metrics/investor)

on:
  schedule:
    # 03:30 UTC = 09:00 IST — fits founder morning review
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: comma-separated agent names to run (default: all daily)'
        required: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run agent fleet (daily set)
        env:
          API_BASE: ${{ secrets.API_BASE_URL || 'https://api.darshya.online' }}
          WEB_BASE: ${{ secrets.WEB_BASE_URL || 'https://darshya.online' }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          CRON_AUTH_TOKEN: ${{ secrets.CRON_AUTH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Wave 3 — env-or-noop. daily-devotional-broadcast skips send if either unset.
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_DEVOTIONAL_TEMPLATE: ${{ secrets.WHATSAPP_DEVOTIONAL_TEMPLATE }}
        run: |
          AGENTS="${{ github.event.inputs.only }}"
          if [ -z "$AGENTS" ]; then
            # Critical daily (post-Sprint-2-S1 kill + S2 Wave 1 add):
            # producing-only set. Wave 1 ops agents file P0 GH issues directly
            # on SLA breaches / refund signals — no human polling needed.
            node scripts/agents/run-all.mjs \
              broken-link weekly-digest \
              booking-quality-monitor onboarding-nudge support-intent-triage \
              cold-temple-outreach referral-nudge dormant-reactivation \
              daily-devotional-broadcast funnel-drop-analyzer \
              social-content-multiplexer investor-weekly-digest-v2
          else
            node scripts/agents/run-all.mjs $(echo "$AGENTS" | tr ',' ' ')
          fi

      - name: Commit reports
        run: |
          git config user.name "darshya-agent-bot"
          git config user.email "agents@darshya.online"
          git add docs/agent-reports/ || true
          if git diff --cached --quiet; then
            echo "No new agent artifacts to commit."
          else
            git commit -m "chore(agents): daily fleet run $(date -u +%Y-%m-%d)"
            git push
          fi
