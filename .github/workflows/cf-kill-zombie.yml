# Kill the Cloudflare Pages zombie auto-deploy (surgical, reversible).
#
# WHY: The CF Pages projects `darshya` (live) + `poojly-web` (legacy) are still
# GitHub-connected in the CF dashboard and auto-deploy on EVERY push, running
# `pnpm --filter @poojly/web pages:build` — a script deleted in f85718a9 when the
# OpenNext/Cloudflare deploy path was abandoned (bundle 5.3 MiB > free 3 MiB;
# web now self-hosts on Render via Next standalone). Every push now fails CF
# Pages with ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT. This is a DASHBOARD-side build
# (NOT a GH Actions workflow), so it can only be stopped via the CF API or the
# CF dashboard UI — no token exists locally, so run this from CI.
#
# SAFE: disabling auto-deploy keeps the LAST successful CF deploy serving
# (darshya.online stays live on Pages until the Render DNS cutover). A failing
# zombie build never replaced prod; disabling it changes nothing user-facing.
# REVERSIBLE: re-enable deployments via the same API or dashboard.
#
# This is Step 0 of render-cutover.yml, extracted as a standalone, non-
# consequential step so the prod DNS flip (Steps A→B) can be done separately
# after verifying the Render *.onrender.com URL. Do NOT bundle the zombie kill
# with the DNS cutover.
name: CF Pages kill zombie
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = report current auto-deploy state only, no changes'
        required: false
        default: 'true'
      verify_only:
        description: 'true = only list recent CF Pages deployments (prove zombie dead after a push) — no PATCH'
        required: false
        default: 'false'

jobs:
  kill-zombie:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable CF Pages auto-deploy (kill zombie)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY: ${{ github.event.inputs.dry_run }}
          VERIFY: ${{ github.event.inputs.verify_only }}
        run: |
          set -uo pipefail
          if [ "$VERIFY" = "true" ]; then
            echo "=== VERIFY ONLY — listing recent CF Pages deployments to confirm no new build fired ==="
            for PROJ in darshya poojly-web; do
              echo "--- recent deployments: $PROJ ---"
              d=$(curl -s -H "Authorization: Bearer ${CF_TOKEN}" \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCT}/pages/projects/${PROJ}/deployments?sort_by=created_on&sort_order=desc&per_page=5")
              if ! echo "$d" | jq -e '.success' >/dev/null 2>&1; then
                echo "  WARN  $PROJ not found/inaccessible"; continue
              fi
              echo "$d" | jq -r '.result[]? | "  \(.created_on)  latest_stage=\(.latest_stage.status // "?")  env=\(.environment // "?")  source=\(.deployment_trigger.metadata.commit_message // .deployment_trigger.metadata.branch // "?")"'
            done
            echo "=== VERIFY complete — if no deployment timestamped AFTER the last push, zombie is dead ==="
            exit 0
          fi
          if [ "$DRY" = "true" ]; then echo "=== DRY RUN — reporting state only, no changes ==="; else echo "=== LIVE — disabling auto-deploy on both projects ==="; fi
          for PROJ in darshya poojly-web; do
            echo "--- CF Pages: $PROJ ---"
            g=$(curl -s -H "Authorization: Bearer ${CF_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCT}/pages/projects/${PROJ}")
            if ! echo "$g" | jq -e '.success' >/dev/null 2>&1; then
              echo "WARN  $PROJ not found/inaccessible — skipping"; echo "$g" | jq '.errors' 2>/dev/null || true; continue
            fi
            # Show current auto-deploy state. The live flag is nested at
            # source.config.deployments_enabled (top-level deployments_enabled
            # is "n/a" on this schema) — confirmed by the dry-run output.
            cur_dep=$(echo "$g" | jq -r '.result.source.config.deployments_enabled // "n/a"')
            cur_prod=$(echo "$g" | jq -r '.result.source.config.production_deployments_enabled // "n/a"')
            echo "  current: source.config.deployments_enabled=$cur_dep  production_deployments_enabled=$cur_prod"
            if [ "$DRY" = "true" ]; then echo "  (dry-run) would set both deployments_enabled + production_deployments_enabled = false"; continue; fi
            # Stop auto-deployments. PRIMARY: PATCH the nested source.config with the
            # FULL config object, only flipping deployments_enabled + production_deployments_enabled
            # to false — preserves the GitHub connection (owner/repo/branch/path filters)
            # so the project stays inspectable + re-enableable, just stops building on push.
            # A succeeding no-op build would clobber prod, so we DISABLE (keeps last deploy)
            # rather than rebuild. Fallbacks: top-level fields, then source:null (severs GH link).
            disabled=0
            # PRIMARY — whole-source PATCH with flipped flags (build the body from the live config).
            BODY_PRIMARY=$(echo "$g" | jq -c '.result.source
              | .config.deployments_enabled = false
              | .config.production_deployments_enabled = false
              | {source: .}')
            for BODY in "$BODY_PRIMARY" \
              '{"deployments_enabled":false,"builds_enabled":false}' \
              '{"builds_enabled":false}' \
              '{"source":null}'; do
              p=$(curl -s -X PATCH -H "Authorization: Bearer ${CF_TOKEN}" \
                -H "Content-Type: application/json" --data "$BODY" \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCT}/pages/projects/${PROJ}")
              if echo "$p" | jq -e '.success' >/dev/null 2>&1; then
                # Verify the flag actually flipped (API can return success without applying).
                new_dep=$(echo "$p" | jq -r '.result.source.config.deployments_enabled // "n/a"')
                new_prod=$(echo "$p" | jq -r '.result.source.config.production_deployments_enabled // "n/a"')
                echo "PASS  $PROJ auto-deploy disabled (now deployments_enabled=$new_dep production_deployments_enabled=$new_prod)"; disabled=1; break
              else
                echo "  attempt -> $(echo "$p" | jq -c '.errors' 2>/dev/null)"
              fi
            done
            [ "$disabled" = "1" ] || echo "WARN  $PROJ could not be disabled via any field (non-blocking — zombie builds already failing, prod unchanged)"
          done
          if [ "$DRY" = "true" ]; then echo "=== DRY RUN complete — re-run with dry_run=false to disable ==="; else echo "=== Zombie killed. darshya.online still served by last CF deploy until Render DNS cutover. ==="; fi
