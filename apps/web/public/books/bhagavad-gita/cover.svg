  <text x="300" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#fff8e1" opacity="0.9">श्रीमद्भगवद्गीता</text>
  <text x="300" y="640" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#ffe0a0" opacity="0.85">The Song of the Lord</text>
  <text x="300" y="730" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#ffe0a0" opacity="0.7">18 Chapters · 700 Verses</text>
