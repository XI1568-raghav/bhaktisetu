<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="Bhagavad Gita cover">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a1e0e"/>
      <stop offset="0.5" stop-color="#b9410f"/>
      <stop offset="1" stop-color="#e8941a"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="32%" r="40%">
      <stop offset="0" stop-color="#fff5d4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff5d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#bg)"/>
  <circle cx="300" cy="260" r="160" fill="url(#halo)"/>
  <g stroke="#fff3c4" stroke-width="2" fill="none" opacity="0.6">
